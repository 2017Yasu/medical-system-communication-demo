# 起動: docker compose up   /   停止: docker compose down（データはインメモリ。次回は初期状態）
services:
  demo:
    build: .
    image: medical-system-communication-demo:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # 仮押さえの期限の既定値（秒、1〜300。S3）。未設定なら 30。デモ制御パネルからも変えられる
      SLOT_HOLD_SECONDS: "30"
